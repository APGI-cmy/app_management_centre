name: Agent Contract Format Gate

# Authority: LIVING_AGENT_SYSTEM.md v6.2.0, AGCFPP-001
# Transition overlay: FOREMAN_OPERATING_MODEL.md and ISMS_AMC_REPO_ALIGNMENT.md
# Purpose: Enforce legacy mechanical agent-contract format checks, while avoiding paradoxes for PR1800 gate-system migration PRs.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/agents/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-contract-format-gate:
    name: "agent-contract/format-gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bypass for layer-down, governance-alignment, and PR1800 transition PRs
        id: bypass_check
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ ( "$PR_LABELS" == *"governance"* && "$PR_LABELS" == *"automated"* && "$PR_LABELS" == *"agent:liaison"* ) || \
               "$PR_BRANCH" == "governance-alignment-auto" || \
               "$PR_BRANCH" == *"layer-down"* || \
               "$PR_BRANCH" == *"pr1800-gate-alignment"* || \
               "$PR_BRANCH" == *"amc-pr1800-gate-alignment"* || \
               "$PR_LABELS" == *"layer-down"* || \
               "$PR_LABELS" == *"pr1800"* || \
               "$PR_TITLE" == *"Layer-Down"* || \
               "$PR_TITLE" == *"layer-down"* || \
               "$PR_TITLE" == *"governance alignment"* || \
               "$PR_TITLE" == *"PR 1800"* || \
               "$PR_TITLE" == *"PR1800"* || \
               "$PR_TITLE" == *"governance gates"* || \
               "$PR_BODY" == *"governance/admin alignment only"* || \
               "$PR_BODY" == *"not a completion, handover, merge-readiness, or build-readiness claim"* ]]; then
            echo "✅ Governance / PR1800 transition PR — bypassing legacy agent-contract format gate."
            echo "Reason: this PR changes the contract format authority itself and does not claim handover, merge readiness, or build readiness."
            echo "bypass=true" >> $GITHUB_OUTPUT
          else
            echo "bypass=false" >> $GITHUB_OUTPUT
          fi

      - name: Check agent contract format (CORE-001 through CORE-012)
        if: steps.bypass_check.outputs.bypass != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "=== Agent Contract Format Gate (CORE-001 to CORE-012) ==="
          echo "Authority: LIVING_AGENT_SYSTEM.md v6.2.0, AGCFPP-001"
          echo ""
          MODIFIED_FILES=$(git diff "$BASE_SHA" HEAD --name-only 2>/dev/null | grep "^\.github/agents/.*\.md$" | grep -v "_archive/" || true)
          if [ -z "$MODIFIED_FILES" ]; then
            echo "No agent contract files modified in this PR — skipping format gate."
            exit 0
          fi
          echo "Modified agent contract files:"
          echo "$MODIFIED_FILES"
          echo ""
          OVERALL_FAIL=false
          while IFS= read -r contract_file; do
            [ -z "$contract_file" ] && continue
            echo "Checking: $contract_file"
            if [ ! -f "$contract_file" ]; then
              echo "File not found; skipping."
              continue
            fi
            FILE_FAIL=false
            DELIMITER_COUNT=$(grep -c '^---$' "$contract_file" || true)
            if [ "$DELIMITER_COUNT" -lt 2 ]; then echo "CORE-001 fail"; FILE_FAIL=true; fi
            AGENT_VERSION=$(awk '/^---$/ { if (past_first) exit; past_first=1; next } past_first && /^agent:/ { in_agent=1; next } in_agent && /^[^[:space:]]/ && !/^[[:space:]]/ { in_agent=0 } in_agent && /^[[:space:]]+version:/ { print "found"; exit }' "$contract_file")
            if [ "$AGENT_VERSION" != "found" ]; then echo "CORE-002 fail"; FILE_FAIL=true; fi
            if ! grep -qE "contract_version:\s+[0-9]+\.[0-9]+\.[0-9]+" "$contract_file"; then echo "CORE-003 fail"; FILE_FAIL=true; fi
            for field in "identity:" "role:" "mission:" "class_boundary:"; do if ! grep -q "$field" "$contract_file"; then echo "CORE-004 missing: $field"; FILE_FAIL=true; fi; done
            for field in "governance:" "protocol:" "canon_inventory:"; do if ! grep -q "$field" "$contract_file"; then echo "CORE-005 missing: $field"; FILE_FAIL=true; fi; done
            if ! grep -q "prohibitions:" "$contract_file" || ! grep -q "enforcement: CONSTITUTIONAL" "$contract_file"; then echo "CORE-008 fail"; FILE_FAIL=true; fi
            if ! grep -q "merge_gate_interface:" "$contract_file" || ! grep -q "parity_required: true" "$contract_file"; then echo "CORE-009 fail"; FILE_FAIL=true; fi
            if ! grep -q "tier2_knowledge:" "$contract_file"; then echo "CORE-010 fail"; FILE_FAIL=true; fi
            for phase in "PHASE 1" "PHASE 2" "PHASE 3" "PHASE 4"; do if ! grep -qi "$phase" "$contract_file"; then echo "CORE-011 missing: $phase"; FILE_FAIL=true; fi; done
            if ! grep -qE "SELF-MOD-" "$contract_file" || ! grep -q "enforcement: CONSTITUTIONAL" "$contract_file"; then echo "CORE-012 fail"; FILE_FAIL=true; fi
            if [ "$FILE_FAIL" = true ]; then OVERALL_FAIL=true; echo "RESULT: $contract_file FAIL"; else echo "RESULT: $contract_file PASS"; fi
          done <<< "$MODIFIED_FILES"
          if [ "$OVERALL_FAIL" = true ]; then
            echo "FAIL — One or more agent contract files failed legacy format checks."
            exit 1
          fi
          echo "PASS — All modified agent contract files passed legacy format checks."
