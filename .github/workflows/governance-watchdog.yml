# Authority: FOREMAN_OPERATING_MODEL.md, ISMS_AMC_REPO_ALIGNMENT.md
# Purpose: Advisory governance gap detection without stale red push checks.

name: Governance Watchdog

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch: {}

permissions:
  pull-requests: read
  issues: write
  contents: read

jobs:
  gap1-no-pr-for-branch:
    name: "watchdog/gap1-no-pr-for-branch"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Check for open PR and post advisory if missing
        uses: actions/github-script@v7
        env:
          PUSH_BRANCH: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        with:
          script: |
            const branch = process.env.PUSH_BRANCH;
            const sha = process.env.PUSH_SHA;
            const exemptPrefixes = ['governance/', 'ripple-', 'governance-alignment', 'dependabot/', 'copilot/'];
            for (const prefix of exemptPrefixes) {
              if (branch.startsWith(prefix)) {
                core.info(`Branch '${branch}' is exempt (matches '${prefix}').`);
                return;
              }
            }
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const findOpenPr = async () => {
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${branch}`,
                per_page: 1,
              });
              return pulls[0] || null;
            };
            for (let attempt = 1; attempt <= 7; attempt += 1) {
              const pr = await findOpenPr();
              if (pr) {
                core.info(`Open PR #${pr.number} exists for branch '${branch}'.`);
                return;
              }
              if (attempt < 7) {
                core.info(`No open PR yet for '${branch}'. Retrying in 10 seconds (${attempt}/6).`);
                await sleep(10000);
              }
            }
            const body = [
              '## Governance Watchdog — No PR Detected',
              '',
              `Commits were pushed to branch \`${branch}\` but no open PR was found after a short retry window.`,
              '',
              'This is advisory only. Once a PR exists, PR-triggered gates are authoritative for readiness.',
              '',
              'Action: open a draft PR before continuing governed work, then rely on the PR gates.'
            ].join('\n');
            try {
              await github.rest.repos.createCommitComment({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha, body });
              core.warning(`Gap 1 advisory posted for '${branch}'.`);
            } catch (e) {
              core.warning(`Could not post Gap 1 advisory comment: ${e.message}`);
            }
            await core.summary.addHeading('Governance Watchdog Gap 1 Advisory').addRaw(`No open PR was found for branch ${branch}. This check is advisory and exits successfully.`).write();
            return;

  watchdog-advisory-baseline:
    name: "watchdog/advisory-baseline"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - run: echo "Governance watchdog is advisory. PR-triggered gates enforce readiness."
