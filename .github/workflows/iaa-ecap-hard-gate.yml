name: IAA and ECAP Hard Gate

# Authority: PPEIA-001, EFIA-001, AAEV-001, ECAP-001 v1.3.0
# Transition overlay: FOREMAN_OPERATING_MODEL.md and ISMS_AMC_REPO_ALIGNMENT.md
# Purpose: Hard-block protected-path merge readiness, while allowing only tightly-scoped CS2-authorized gate self-repair.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-protected-paths:
    name: "iaa-ecap/classify-protected-paths"
    runs-on: ubuntu-latest
    outputs:
      is_protected_path_pr: ${{ steps.classify.outputs.is_protected_path_pr }}
      requires_iaa:          ${{ steps.classify.outputs.requires_iaa }}
      is_auto_bypass:        ${{ steps.classify.outputs.is_auto_bypass }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify PR and detect bypass conditions
        id: classify
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_BODY:   ${{ github.event.pull_request.body }}
        run: |
          echo "=== IAA / ECAP Gate — PR Classification ==="
          echo "Authority: PPEIA-001, EFIA-001, ECAP-001 with AMC transition overlay"
          echo ""

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "origin/${BASE_REF}"...HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED" | head -30

          AUTO_BYPASS=false

          # CS2 narrow self-repair bypass.
          # This is intentionally stricter than the legacy PR1800 transition bypass:
          # - the PR must explicitly be a gate self-repair PR;
          # - the PR body must record CS2 override authorization;
          # - the PR body must include the no-handover/build-ready disavowal;
          # - every changed file must be a known gate/governance control file;
          # - explicit positive handover/build-ready/merge-ready claims block the bypass.
          SELF_REPAIR_REQUESTED=false
          if [[ "$PR_TITLE" == *"self-repair"* || \
                "$PR_TITLE" == *"hard-gate"* || \
                "$PR_BRANCH" == *"self-repair"* || \
                "$PR_BRANCH" == *"hard-gate"* || \
                "$PR_BODY" == *"gate self-repair"* || \
                "$PR_BODY" == *"self-repair bypass"* ]]; then
            SELF_REPAIR_REQUESTED=true
          fi

          CS2_OVERRIDE_PRESENT=false
          if [[ "$PR_BODY" == *"CS2 override"* || "$PR_BODY" == *"CS2 override authorization"* ]]; then
            CS2_OVERRIDE_PRESENT=true
          fi

          NO_HANDOVER_OR_BUILD_READY_CLAIM=false
          if [[ "$PR_BODY" == *"not a completion, handover, merge-readiness, or build-readiness claim"* || \
                "$PR_BODY" == *"No handover/build-ready claim"* || \
                "$PR_BODY" == *"no handover/build-ready claim"* ]]; then
            NO_HANDOVER_OR_BUILD_READY_CLAIM=true
          fi

          HAS_POSITIVE_READY_CLAIM=false
          POSITIVE_READY_PATTERNS="handover complete|build-ready:[[:space:]]*true|build readiness:[[:space:]]*pass|merge-ready|merge readiness:[[:space:]]*pass|production-ready|ready for implementation"
          if echo "$PR_TITLE" "$PR_BODY" | grep -qiE "$POSITIVE_READY_PATTERNS"; then
            HAS_POSITIVE_READY_CLAIM=true
          fi

          SELF_REPAIR_FILES_ONLY=true
          SELF_REPAIR_ALLOWED_PATTERNS=(
            "^\.github/workflows/iaa-ecap-hard-gate\.yml$"
            "^\.github/scripts/validate-iaa-final-assurance\.py$"
            "^\.github/scripts/validate-ecap-ceremony\.py$"
            "^tests/test_iaa_ecap_gates\.py$"
            "^governance/canon/.*(GATE|Gate|gate|IAA|ECAP|ASSURANCE|Assurance|assurance|BYPASS|Bypass|bypass).*\.md$"
            "^\.admin/pr\.json$"
          )
          while IFS= read -r fpath; do
            [ -z "$fpath" ] && continue
            allowed=false
            for pattern in "${SELF_REPAIR_ALLOWED_PATTERNS[@]}"; do
              if echo "$fpath" | grep -qE "$pattern"; then allowed=true; break; fi
            done
            if [ "$allowed" != "true" ]; then
              echo "Self-repair bypass rejected: non-gate/non-governance file changed: $fpath"
              SELF_REPAIR_FILES_ONLY=false
              break
            fi
          done <<< "$CHANGED"

          if [[ "$SELF_REPAIR_REQUESTED" == "true" && \
                "$CS2_OVERRIDE_PRESENT" == "true" && \
                "$NO_HANDOVER_OR_BUILD_READY_CLAIM" == "true" && \
                "$HAS_POSITIVE_READY_CLAIM" == "false" && \
                "$SELF_REPAIR_FILES_ONLY" == "true" ]]; then
            echo "✅ Narrow CS2 gate self-repair bypass activated."
            echo "Reason: governance-only gate repair, no product/runtime changes, CS2 override present, no handover/build-ready claim."
            AUTO_BYPASS=true
          fi

          if [ "$AUTO_BYPASS" = "true" ]; then
            echo "is_auto_bypass=true"        >> $GITHUB_OUTPUT
            echo "is_protected_path_pr=false" >> $GITHUB_OUTPUT
            echo "requires_iaa=false"         >> $GITHUB_OUTPUT
            exit 0
          fi

          # Legacy transition bypass retained for already-defined PR1800 governance alignment cases.
          if [[ ( "$PR_LABELS" == *"governance"* && "$PR_LABELS" == *"automated"* && "$PR_LABELS" == *"agent:liaison"* ) || \
               "$PR_BRANCH" == "governance-alignment-auto" || \
               "$PR_BRANCH" == *"layer-down"* || \
               "$PR_BRANCH" == *"pr1800-gate-alignment"* || \
               "$PR_BRANCH" == *"amc-pr1800-gate-alignment"* || \
               "$PR_LABELS" == *"layer-down"* || \
               "$PR_LABELS" == *"pr1800"* || \
               "$PR_TITLE" == *"PR 1800"* || \
               "$PR_TITLE" == *"PR1800"* || \
               "$PR_TITLE" == *"governance gates"* || \
               "$PR_BODY" == *"governance/admin alignment only"* || \
               "$PR_BODY" == *"not a completion, handover, merge-readiness, or build-readiness claim"* ]]; then
            echo "✅ Governance / PR1800 alignment PR — legacy IAA/ECAP final ceremony gate is bypassed."
            echo "Reason: this PR changes the gate system itself and does not claim handover, merge readiness, or build readiness."
            AUTO_BYPASS=true
          fi

          echo "is_auto_bypass=$AUTO_BYPASS" >> $GITHUB_OUTPUT
          if [ "$AUTO_BYPASS" = "true" ]; then
            echo "is_protected_path_pr=false" >> $GITHUB_OUTPUT
            echo "requires_iaa=false"         >> $GITHUB_OUTPUT
            exit 0
          fi

          # Simple Admin Model bypass: .admin/pr.json with type=product-fix/docs-only and no forced ceremony paths.
          if [ -f ".admin/pr.json" ]; then
            SA_VALID=$(python3 -c "import json,sys; d=json.load(open('.admin/pr.json')); req=['type','requires_iaa','requires_ecap','governing_issue','scope_summary']; vtypes=['product-fix','docs-only','governance-control','agent-contract','migration','deployment','high-risk']; all(f in d for f in req) or sys.exit(1); isinstance(d['requires_iaa'],bool) and isinstance(d['requires_ecap'],bool) or sys.exit(1); d['type'] in vtypes or sys.exit(1); print('true')" 2>/dev/null || echo "false")
            SA_TYPE=$(python3 -c "import json,sys; d=json.load(open('.admin/pr.json')); print(d.get('type',''))" 2>/dev/null || echo "")
            SA_REQ_IAA=$(python3 -c "import json,sys; d=json.load(open('.admin/pr.json')); print(str(d.get('requires_iaa',True)).lower())" 2>/dev/null || echo "true")
            SA_REQ_ECAP=$(python3 -c "import json,sys; d=json.load(open('.admin/pr.json')); print(str(d.get('requires_ecap',True)).lower())" 2>/dev/null || echo "true")
            if [[ "$SA_VALID" == "true" ]] && [[ "$SA_TYPE" == "product-fix" || "$SA_TYPE" == "docs-only" ]] && [[ "$SA_REQ_IAA" == "false" ]] && [[ "$SA_REQ_ECAP" == "false" ]]; then
              CHANGED_SA="$CHANGED"
              HAS_FORCED_PATHS=false
              FORCED_PATTERNS=("^\.github/agents/" "^\.github/workflows/" "^\.github/scripts/" "^governance/" "^\.governance-pack/" "^\.agent-workspace/.*/knowledge/" "^\.agent-admin/" "supabase/migrations/" "^schema/" "^migrations/" "BUILD_PROGRESS_TRACKER")
              while IFS= read -r fpath; do
                [ -z "$fpath" ] && continue
                for pattern in "${FORCED_PATTERNS[@]}"; do
                  if echo "$fpath" | grep -qE "$pattern"; then HAS_FORCED_PATHS=true; break 2; fi
                done
              done <<< "$CHANGED_SA"
              if [ "$HAS_FORCED_PATHS" = "false" ]; then
                echo "✅ Simple Admin bypass activated."
                echo "is_auto_bypass=true"          >> $GITHUB_OUTPUT
                echo "is_protected_path_pr=false"   >> $GITHUB_OUTPUT
                echo "requires_iaa=false"           >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
          fi

          IS_PROTECTED=false
          PROTECTED_PATTERNS=("^governance/" "^\.agent-admin/" "^\.github/agents/" "^\.governance-pack/" "^\.agent-workspace/.*/knowledge/" "supabase/migrations/" "schema/" "migrations/" "BUILD_PROGRESS_TRACKER")
          GOVERNANCE_KEYWORDS="governance|iaa|handover|injector|ecap|merge.gate|protected.path|ceremony|assurance|prehandover|preflight|boundary|polc|session.memory|wave.record"
          while IFS= read -r fpath; do
            [ -z "$fpath" ] && continue
            for pattern in "${PROTECTED_PATTERNS[@]}"; do
              if echo "$fpath" | grep -qP "$pattern"; then IS_PROTECTED=true; break 2; fi
            done
            if echo "$fpath" | grep -qE "^\.github/workflows/|^\.github/scripts/"; then
              if echo "$fpath" | grep -qiE "$GOVERNANCE_KEYWORDS"; then IS_PROTECTED=true; break; fi
            fi
          done <<< "$CHANGED"
          echo "is_protected_path_pr=$IS_PROTECTED" >> $GITHUB_OUTPUT

          REQUIRES_IAA=false
          if [[ "$PR_LABELS" == *"agent:"* ]] || [[ "$PR_LABELS" == *"foreman"* ]] || [[ "$PR_LABELS" == *"governance"* ]] || [[ "$IS_PROTECTED" == "true" ]]; then
            REQUIRES_IAA=true
          fi
          echo "requires_iaa=$REQUIRES_IAA" >> $GITHUB_OUTPUT
          echo "Classification summary: protected=$IS_PROTECTED requires_iaa=$REQUIRES_IAA auto_bypass=$AUTO_BYPASS"

  iaa-final-assurance-gate:
    name: "iaa-ecap/iaa-final-assurance"
    runs-on: ubuntu-latest
    needs: classify-protected-paths
    if: |
      needs.classify-protected-paths.outputs.is_auto_bypass != 'true' &&
      needs.classify-protected-paths.outputs.requires_iaa == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run IAA final assurance gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
          PR_BODY:   ${{ github.event.pull_request.body }}
        run: |
          echo "=== IAA Final Assurance Hard Gate ==="
          GOVERNING_ISSUE=""
          ISSUE_MATCH=$(echo "$PR_BODY" | grep -oP '(?:governing_delivery_issue|governing_issue)\s*:\s*#(\d+)' | grep -oP '\d+' | head -1 || true)
          if [ -n "$ISSUE_MATCH" ]; then GOVERNING_ISSUE="--governing-issue $ISSUE_MATCH"; fi
          python3 .github/scripts/validate-iaa-final-assurance.py --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" $GOVERNING_ISSUE --repo-root .

  ecap-ceremony-gate:
    name: "iaa-ecap/ecap-ceremony"
    runs-on: ubuntu-latest
    needs: classify-protected-paths
    if: |
      needs.classify-protected-paths.outputs.is_auto_bypass != 'true' &&
      needs.classify-protected-paths.outputs.is_protected_path_pr == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ECAP ceremony gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "=== ECAP Ceremony Hard Gate ==="
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}"...HEAD 2>/dev/null || echo "")
          echo "$CHANGED_FILES" | python3 .github/scripts/validate-ecap-ceremony.py --pr-number "$PR_NUMBER" --files-from-stdin --repo-root .

  iaa-ecap-gate-summary:
    name: "iaa-ecap/gate-summary"
    runs-on: ubuntu-latest
    needs:
      - classify-protected-paths
      - iaa-final-assurance-gate
      - ecap-ceremony-gate
    if: always()
    steps:
      - name: Gate summary
        env:
          CLASSIFY_RESULT:  ${{ needs.classify-protected-paths.result }}
          IAA_RESULT:       ${{ needs.iaa-final-assurance-gate.result }}
          ECAP_RESULT:      ${{ needs.ecap-ceremony-gate.result }}
          IS_AUTO_BYPASS:   ${{ needs.classify-protected-paths.outputs.is_auto_bypass }}
          IS_PROTECTED:     ${{ needs.classify-protected-paths.outputs.is_protected_path_pr }}
          REQUIRES_IAA:     ${{ needs.classify-protected-paths.outputs.requires_iaa }}
        run: |
          echo "=== IAA / ECAP Hard Gate Summary ==="
          echo "Classification:   $CLASSIFY_RESULT"
          echo "Auto-bypass:      $IS_AUTO_BYPASS"
          echo "Protected-path:   $IS_PROTECTED"
          echo "Requires IAA:     $REQUIRES_IAA"
          echo "IAA gate result:  $IAA_RESULT"
          echo "ECAP gate result: $ECAP_RESULT"
          GATE_FAILED=false
          if [ "$IS_AUTO_BYPASS" = "true" ]; then
            echo "✅ GATE PASS (authorized governance self-repair or PR1800 transition bypass; no handover/build-ready claim)"
            exit 0
          fi
          if [ "$REQUIRES_IAA" = "true" ] && [ "$IAA_RESULT" = "failure" ]; then echo "❌ IAA FINAL ASSURANCE GATE: FAILED"; GATE_FAILED=true; fi
          if [ "$IS_PROTECTED" = "true" ] && [ "$ECAP_RESULT" = "failure" ]; then echo "❌ ECAP CEREMONY GATE: FAILED"; GATE_FAILED=true; fi
          if [ "$GATE_FAILED" = "true" ]; then
            echo "❌ COMBINED GATE: FAIL — merge is BLOCKED"
            exit 1
          fi
          echo "✅ COMBINED GATE: PASS"
